name: CI

on:
  pull_request:
    branches: [dev, staging, main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q

      - name: Docker build
        run: docker build -t mlops-entrainement:ci .

      - name: Run container
        run: docker run -d --name app -p 8000:8000 mlops-entrainement:ci

      - name: Smoke test
        run: bash scripts/smoke.sh http://localhost:8000

      - name: Container logs
        if: failure()
        run: docker logs app || true
